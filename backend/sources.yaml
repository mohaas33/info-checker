# Trusted domains for web search. Tavily only returns results from these domains
# (passed as include_domains). Edit freely: add or remove lines, keep the "- domain"
# format. Group names are just for readability; all groups are merged.
#
# Subdomains are included automatically (e.g. "bbc.com" also covers www.bbc.com).
# Changing this list changes the cache key, so you'll get fresh results.

wire_services:
  - reuters.com
  - apnews.com
  - afp.com

